version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: happypaws-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-happypaws}
      MYSQL_DATABASE: ${DB_NAME:-clinic}
      MYSQL_USER: ${DB_USER:-happypaws}
      MYSQL_PASSWORD: ${DB_PASSWORD:-happypaws}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: happypaws-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${DB_NAME:-clinic}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-happypaws}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-happypaws}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      JWT_SECRET: ${JWT_SECRET:-changeme_use_a_long_random_string}
      SERVER_PORT: 8082
    ports:
      - "8082:8082"

  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_API_URL: ${REACT_APP_API_URL:-http://localhost:8082/api}
        REACT_APP_ML_URL: ${REACT_APP_ML_URL:-}
    container_name: happypaws-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  mysql_data:
